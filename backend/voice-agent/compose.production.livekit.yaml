name: monban

services:
  livekit:
    image: livekit/livekit-server:v1.9.0
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./.local/livekit.production.local.yaml:/etc/livekit.yaml:ro
    # Only signaling is loopback-bound for local diagnostics. Public audio uses
    # the authenticated WSS /api/relay PCM bridge through Cloudflare Tunnel.
    ports:
      - "127.0.0.1:7880:7880/tcp"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      monban:
        ipv4_address: 172.30.40.10

  api:
    depends_on:
      livekit:
        condition: service_started

  agent:
    depends_on:
      livekit:
        condition: service_started

