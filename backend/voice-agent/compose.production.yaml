name: monban

services:
  api:
    image: monban-backend:${MONBAN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${MONBAN_ENV_FILE:-.env.production}
    command:
      - uvicorn
      - monban_backend.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8093"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --no-access-log
    ports:
      - "127.0.0.1:${MONBAN_API_PORT:-8093}:8093"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - monban

  agent:
    image: monban-backend:${MONBAN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${MONBAN_ENV_FILE:-.env.production}
    command: ["python", "-m", "monban_backend.agent", "start"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4.0
    logging: *default-logging
    networks:
      - monban

networks:
  monban:
    ipam:
      config:
        - subnet: 172.30.40.0/24
          gateway: 172.30.40.1
