# Monban ModSecurity reference rules.
#
# Include after the OWASP CRS so ruleRemoveTargetByTag can see CRS tags.
# Start with DetectionOnly, review false positives, then switch to On.

SecRuleEngine DetectionOnly

SecRequestBodyAccess On
SecRequestBodyLimit 16384
SecRequestBodyNoFilesLimit 16384
SecRequestBodyInMemoryLimit 16384
SecResponseBodyAccess Off
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000
SecDebugLogLevel 0

# Reject methods the API never uses. Kept in detection mode by default.
SecRule REQUEST_METHOD "@pm TRACE TRACK" \
    "id:10000,phase:1,pass,nolog,msg:'Monban: TRACE/TRACK is not used'"

# The relay is a WebSocket. Do not inspect the handshake key as a payload.
SecRule REQUEST_URI "@streq /api/relay" \
    "id:10002,phase:1,pass,nolog,\
     ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:Sec-WebSocket-Key"

# Keep the API body small. Nginx enforces the same limit; this is defense in depth.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:10003,phase:1,pass,nolog,\
     ctl:requestBodyLimit=16384"
