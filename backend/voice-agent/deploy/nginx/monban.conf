# Monban reference Nginx configuration.
#
# Replace monban.example.jp and the certificate paths before use.
# This file is a template; include it from the http {} block.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=monban_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=monban_conn:10m;

upstream monban_api {
    server 127.0.0.1:8093;
    keepalive 16;
}

# Optional: use a separate hostname for LiveKit signalling.
upstream monban_livekit {
    server 127.0.0.1:7880;
    keepalive 8;
}

# Log $uri rather than $request_uri so query values never reach the log.
log_format monban '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name monban.example.jp;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monban.example.jp;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/monban.example.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monban.example.jp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    # Add the real LiveKit host to connect-src if it is not this origin.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; style-src 'self'; connect-src 'self' wss://monban.example.jp wss://livekit.example.jp" always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    access_log /var/log/nginx/monban.access.log monban;
    error_log  /var/log/nginx/monban.error.log warn;

    # WebSocket relay from the PSoC 6 / diagnostic client.
    location = /api/relay {
        limit_req zone=monban_api burst=20 nodelay;
        limit_conn monban_conn 4;

        proxy_pass http://monban_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        limit_req zone=monban_api burst=30 nodelay;
        limit_conn monban_conn 16;
        client_max_body_size 16k;

        proxy_pass http://monban_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /env-config.js {
        proxy_pass http://monban_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires -1;
    }

    location /assets/ {
        proxy_pass http://monban_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://monban_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        expires -1;
    }
}

# Optional: LiveKit signalling on a separate hostname.
# WebRTC media still uses UDP 50000-50100 (or TURN) directly.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name livekit.example.jp;

    ssl_certificate     /etc/letsencrypt/live/livekit.example.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.example.jp/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass http://monban_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
