name: Voice Agent Backend CI

on:
  pull_request:
    paths:
      - "voice-agent-backend/**"
      - ".github/workflows/voice-agent-backend.yml"
  push:
    branches:
      - main
      - codex/voice-agent-backend
    paths:
      - "voice-agent-backend/**"
      - ".github/workflows/voice-agent-backend.yml"

permissions:
  contents: read

concurrency:
  group: voice-agent-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra test
      - run: uv run python -m pytest
