[project]
name = "door-voice-backend"
version = "1.0.0"
description = "Local Japanese voice agent backend for a door intercom prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiohttp>=3.10,<4",
  "fastapi>=0.115,<1",
  "livekit-agents[openai,silero]>=1.8,<2",
  "livekit-api>=1.2,<2",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
